# Gradle
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Kotlin
kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=true
kotlin.mpp.stability.nowarn=true
kotlin.mpp.androidSourceSetLayoutVersion=2

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# KSP — KSP2 has incompatibilities with Hilt 2.52. Use KSP1 until Hilt catches up.
# Tracking: https://github.com/google/dagger/issues/4766
ksp.useKSP2=false
