name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_HOME: /opt/homebrew/opt/openjdk@21

jobs:
  android-build:
    name: Android build + test
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug

      - name: Run shared KMP unit tests
        run: ./gradlew :shared:jvmTest :shared:allTests

      - name: Run Android unit tests
        run: ./gradlew :android:testDebugUnitTest

  ios-build:
    name: iOS build
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build KMP framework for iOS
        # Pod install is deferred until the iOS Xcode project exists.
        run: ./gradlew :shared:linkDebugFrameworkIosX64 :shared:linkDebugFrameworkIosArm64

      # iOS Xcode build will be enabled once ios/mm-mobile.xcodeproj is created.
