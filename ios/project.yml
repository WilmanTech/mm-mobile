name: MusicManager
options:
  bundleIdPrefix: com.wtm.musicmanager
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    # Required for .glassEffect / .glassButtonStyle — these APIs were
    # introduced in iOS 26. Building against an older deployment target
    # still works but the glass modifiers would be unavailable at runtime.
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MusicManager:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MusicManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wtm.musicmanager.MusicManager
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleURLTypes: ""
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - sdk: Foundation.framework
      - sdk: SwiftUI.framework
      - sdk: UIKit.framework

schemes:
  MusicManager:
    build:
      targets:
        MusicManager: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
